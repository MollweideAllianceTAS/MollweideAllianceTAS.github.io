name: Check website content

on:
  pull_request:
    paths:
      - 'content/**'
      - 'assets/img/members/**'
      - 'assets/js/**'
      - 'tools/**'
      - 'package.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - run: npm test
      - name: Confirm generated files were committed
        run: git diff --exit-code
